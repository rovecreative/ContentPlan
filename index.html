                details: "7 Slides Breakdown",
                summary: "Sistem checklist 5 tahap: Riset, Pra-Produksi, Produksi, Pascaproduksi, Evaluasi.",
                slides: [
                    "Slide 1 (Hook): Biar gak pusing tiap hari, pake checklist workflow ini.",
                    "Slide 2: Fase Riset: Catat 5 masalah terbanyak audiens lu minggu ini.",
                    "Slide 3: Fase Pra-Produksi: Tulis skrip pendek + siapkan b-roll/asset.",
                    "Slide 4: Fase Produksi: Rekam sekaligus 3-4 video (batching).",
                    "Slide 5: Fase Pascaproduksi: Edit, beri teks/caption, dan siapkan thumbnail.",
                    "Slide 6: Fase Evaluasi: Cek insight 24 jam setelah upload (Saves & Shares).",
                    "Slide 7 (CTA): Komen 'ROVE' kalau lu mau gabung komunitas belajar bareng kita!"
                ]
            },
            {
                id: 12,
                date: "October 30, 2026",
                pic: "Hana",
                type: "Video",
                status: "Uploaded",
                pillar: "Teknis Equipment & Setup",
                title: "Checklist Alat Ngonten Pemula dari Modal Rp0 sampai Siap Upgrade",
                details: "55 Seconds Reels",
                summary: "Panduan bertahap setup studio dari HP + natural light sampai mic wireless & LED.",
                script: [
                    "[00:00 - 00:06] HOOK: 'Mau mulai ngonten tapi bingung beli alat apa dulu? Ini urutan prioritasnya.'",
                    "[00:06 - 00:20] LEVEL 1 (Modal Rp0): HP yang lu punya sekarang + Cahaya matahari dekat jendela.",
                    "[00:20 - 00:35] LEVEL 2 (Budget Rp100k - Rp300k): Tripod HP murah + Mic Clip-on wireless murah (Prioritas suara jernih > gambar bagus).",
                    "[00:35 - 00:45] LEVEL 3 (Upgrade): Lampu LED portable & Microphone yang lebih profesional.",
                    "[00:45 - 00:55] CTA: 'Lu sekarang ada di Level berapa? Tulis di kolom komentar!'"
                ]
            }
        ];

        const STATUSES = ['Designing', 'Editing', 'Revisiting', 'Uploaded'];

        // Load data from localStorage or fallback
        let contentData = JSON.parse(localStorage.getItem('rove_content_plan_2026')) || DEFAULT_DATA;
        let currentFilter = 'all';
        let currentView = 'grid';
        let activeModalId = null;

        function saveData() {
            localStorage.setItem('rove_content_plan_2026', JSON.stringify(contentData));
            updateStats();
        }

        function resetDataToDefault() {
            if (confirm("Reset seluruh naskah dan status ke template awal?")) {
                contentData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveData();
                renderContent();
            }
        }

        // Cycle Status on Pill Click
        function cycleStatus(id, event) {
            if (event) event.stopPropagation();
            const item = contentData.find(x => x.id === id);
            if (!item) return;

            const currentIndex = STATUSES.indexOf(item.status);
            const nextIndex = (currentIndex + 1) % STATUSES.length;
            item.status = STATUSES[nextIndex];

            saveData();
            renderContent();
        }

        function setSpecificStatus(id, newStatus, event) {
            if (event) event.stopPropagation();
            const item = contentData.find(x => x.id === id);
            if (!item) return;
            item.status = newStatus;
            saveData();
            renderContent();
        }

        function updateSummaryText(id, newText) {
            const item = contentData.find(x => x.id === id);
            if (!item) return;
            item.summary = newText;
            saveData();
        }

        function updateStats() {
            const counts = { Designing: 0, Editing: 0, Revisiting: 0, Uploaded: 0 };
            contentData.forEach(item => {
                if (counts[item.status] !== undefined) counts[item.status]++;
            });

            document.getElementById('stat-designing').innerText = counts.Designing;
            document.getElementById('stat-editing').innerText = counts.Editing;
            document.getElementById('stat-revisiting').innerText = counts.Revisiting;
            document.getElementById('stat-uploaded').innerText = counts.Uploaded;
        }

        function getStatusBadgeHTML(status, id) {
            const styleMap = {
                'Designing': 'bg-amber-500/10 text-amber-400 border-amber-500/30 hover:bg-amber-500/20',
                'Editing': 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30 hover:bg-cyan-500/20',
                'Revisiting': 'bg-purple-500/10 text-purple-400 border-purple-500/30 hover:bg-purple-500/20',
                'Uploaded': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20'
            };

            const iconMap = {
                'Designing': '🎨',
                'Editing': '✂️',
                'Revisiting': '🔄',
                'Uploaded': '🚀'
            };

            return `
                <button onclick="cycleStatus(${id}, event)" title="Klik untuk ubah status" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border ${styleMap[status] || 'bg-slate-800 text-slate-300'} transition-all flex items-center gap-1.5 shadow-sm">
                    <span>${iconMap[status] || '•'}</span>
                    <span>${status}</span>
                </button>
            `;
        }

        // Filter Logic
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = "filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20";
                } else {
                    btn.className = "filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800/80 text-slate-300 hover:bg-slate-700 transition-all";
                }
            });
            renderContent();
        }

        function setView(view) {
            currentView = view;
            const gridBtn = document.getElementById('view-grid-btn');
            const tableBtn = document.getElementById('view-table-btn');
            
            if (view === 'grid') {
                gridBtn.className = "p-1.5 rounded-lg bg-slate-800 text-emerald-400 transition-all";
                tableBtn.className = "p-1.5 rounded-lg text-slate-400 hover:text-white transition-all";
            } else {
                tableBtn.className = "p-1.5 rounded-lg bg-slate-800 text-emerald-400 transition-all";
                gridBtn.className = "p-1.5 rounded-lg text-slate-400 hover:text-white transition-all";
            }
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            const filtered = contentData.filter(item => {
                const matchesFilter = currentFilter === 'all' || 
                    item.pic === currentFilter || 
                    item.type === currentFilter;
                
                const matchesStatus = statusFilter === 'all' || item.status === statusFilter;

                const matchesSearch = item.title.toLowerCase().includes(searchVal) ||
                    item.pillar.toLowerCase().includes(searchVal) ||
                    item.summary.toLowerCase().includes(searchVal) ||
                    item.date.toLowerCase().includes(searchVal);

                return matchesFilter && matchesStatus && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-12 text-center rounded-2xl">
                        <p class="text-slate-400 text-sm">Tidak ada naskah yang sesuai dengan kriteria pencarian atau status.</p>
                    </div>
                `;
                return;
            }

            if (currentView === 'grid') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${filtered.map(item => createCardHTML(item)).join('')}
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl overflow-x-auto">
                        <table class="w-full text-left text-xs text-slate-300">
                            <thead class="bg-slate-900/80 text-slate-400 border-b border-slate-800 uppercase tracking-wider">
                                <tr>
                                    <th class="p-4">Tanggal</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">PIC</th>
                                    <th class="p-4">Format</th>
                                    <th class="p-4">Pillar & Naskah Topik</th>
                                    <th class="p-4 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                ${filtered.map(item => createTableRowHTML(item)).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            updateStats();
        }

        function createCardHTML(item) {
            const isRoy = item.pic === 'Roy';
            const picBadgeClass = isRoy 
                ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' 
                : 'bg-pink-500/10 text-pink-400 border-pink-500/20';
            
            const typeBadgeClass = item.type === 'Carousel'
                ? 'bg-amber-500/10 text-amber-400 border-amber-500/20'
                : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20';

            return `
                <div class="glass-card rounded-2xl p-5 flex flex-col justify-between hover:translate-y-[-2px] transition-all duration-200">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="text-xs font-medium text-slate-400">${item.date}</span>
                            <div class="flex items-center gap-1.5">
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold border ${picBadgeClass}">${item.pic}</span>
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold border ${typeBadgeClass}">${item.type}</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-between gap-2 mb-2">
                            <p class="text-[11px] font-medium text-emerald-400 tracking-wide uppercase">${item.pillar}</p>
                            ${getStatusBadgeHTML(item.status, item.id)}
                        </div>

                        <h3 class="text-base font-bold text-white leading-snug mb-2">${item.title}</h3>
                        
                        <!-- Editable Ringkasan Deskripsi -->
                        <div class="mb-4">
                            <label class="block text-[10px] text-slate-500 uppercase font-semibold mb-1">Deskripsi Ringkas (Dapat Diubah):</label>
                            <textarea onchange="updateSummaryText(${item.id}, this.value)" rows="2" class="w-full bg-slate-900/80 text-xs text-slate-300 p-2 rounded-xl border border-slate-800 focus:outline-none focus:border-emerald-500 transition-all resize-none">${item.summary}</textarea>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between">
                        <span class="text-[11px] text-slate-500 font-medium">${item.details}</span>
                        <button onclick="openModal(${item.id})" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all flex items-center gap-1">
                            <span>Edit Full Naskah</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function createTableRowHTML(item) {
            const isRoy = item.pic === 'Roy';
            const picBadgeClass = isRoy 
                ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' 
                : 'bg-pink-500/10 text-pink-400 border-pink-500/20';

            return `
                <tr class="hover:bg-slate-800/40 transition-all">
                    <td class="p-4 font-medium whitespace-nowrap text-slate-300">${item.date}</td>
                    <td class="p-4 whitespace-nowrap">${getStatusBadgeHTML(item.status, item.id)}</td>
                    <td class="p-4"><span class="px-2 py-0.5 rounded-md text-[10px] font-semibold border ${picBadgeClass}">${item.pic}</span></td>
                    <td class="p-4 whitespace-nowrap">${item.type} <span class="text-slate-500">(${item.details})</span></td>
                    <td class="p-4">
                        <div class="font-bold text-white">${item.title}</div>
                        <div class="text-[11px] text-slate-400">${item.pillar}</div>
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="openModal(${item.id})" class="px-3 py-1 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all">
                            Edit Naskah
                        </button>
                    </td>
                </tr>
            `;
        }

        // Modal Handler
        function openModal(id) {
            const item = contentData.find(x => x.id === id);
            if (!item) return;
            activeModalId = id;

            const modal = document.getElementById('detail-modal');
            const isRoy = item.pic === 'Roy';
            
            document.getElementById('modal-tags').innerHTML = `
                <span class="px-2.5 py-0.5 rounded-md text-xs font-semibold border ${isRoy ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-pink-500/10 text-pink-400 border-pink-500/20'}">${item.pic}</span>
                <span class="px-2.5 py-0.5 rounded-md text-xs font-semibold border bg-slate-800 text-slate-300 border-slate-700">${item.type}</span>
                <span class="text-xs font-semibold text-slate-400">Status:</span>
                <select id="modal-status-select" class="bg-slate-900 border border-slate-700 text-xs text-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:border-emerald-500">
                    ${STATUSES.map(s => `<option value="${s}" ${s === item.status ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
            `;
            
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-meta').innerText = `${item.date} • ${item.pillar} • ${item.details}`;

            const modalBody = document.getElementById('modal-body');
            const scriptLines = item.type === 'Carousel' ? item.slides.join('\n') : item.script.join('\n');
            
            modalBody.innerHTML = `
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Judul / Topik Utama:</label>
                    <input type="text" id="modal-edit-title" value="${item.title}" class="w-full bg-slate-900 text-sm text-white p-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-emerald-500 transition-all font-semibold">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Deskripsi Ringkas / Summary:</label>
                    <input type="text" id="modal-edit-summary" value="${item.summary}" class="w-full bg-slate-900 text-xs text-slate-200 p-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-emerald-500 transition-all">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-semibold text-slate-400">
                            ${item.type === 'Carousel' ? 'Edit Struktur Slide Carousel (1 Baris = 1 Slide):' : 'Edit Full Script & Timecode (1 Baris = 1 Section):'}
                        </label>
                        <span class="text-[10px] text-emerald-400 font-mono">Real-Time Text Editor</span>
                    </div>
                    <textarea id="modal-edit-lines" rows="10" class="w-full bg-slate-900 text-xs font-mono text-slate-200 p-3 rounded-xl border border-slate-700 focus:outline-none focus:border-emerald-500 transition-all leading-relaxed">${scriptLines}</textarea>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function saveModalChanges() {
            if (!activeModalId) return;
            const item = contentData.find(x => x.id === activeModalId);
            if (!item) return;

            item.title = document.getElementById('modal-edit-title').value;
            item.summary = document.getElementById('modal-edit-summary').value;
            item.status = document.getElementById('modal-status-select').value;

            const linesText = document.getElementById('modal-edit-lines').value;
            const linesArray = linesText.split('\n').filter(line => line.trim() !== '');

            if (item.type === 'Carousel') {
                item.slides = linesArray;
            } else {
                item.script = linesArray;
            }

            saveData();
            renderContent();

            const toast = document.getElementById('toast-msg');
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
                closeModal();
            }, 800);
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            activeModalId = null;
        }

        window.onclick = function(event) {
            const modal = document.getElementById('detail-modal');
            if (event.target === modal) closeModal();
        }

        // Initialize App
        renderContent();
    </script>
</body>
</html>
